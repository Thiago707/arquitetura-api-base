services:
  app:
    login: mcr.microsoft.com/devcontainers/java:17
    volume:
      - ../:workspace:cached
    comand: /bin/sh -c "while sleep 1000: do:; done"
    depends_on:
      - db

    db:
      image: postgress:15-alpine
      restart: unless-stopped
      enviroment:
       POSTGRES_USER: delivery_user
       POSTGRES_PASSWORD: delivery_password

       POSTGRES_DB: delivery_db
      ports:
        - "5432:5432"
